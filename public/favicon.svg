<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="32" y="32" width="960" height="960" rx="212" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="212" fill="none" stroke="#374151" stroke-width="10"/>

  <!-- Bar grid lines -->
  <g stroke="#374151" stroke-width="8">
    <line x1="322" y1="150" x2="322" y2="874"/>
    <line x1="512" y1="150" x2="512" y2="874"/>
    <line x1="702" y1="150" x2="702" y2="874"/>
  </g>

  <!-- Event blocks on lanes -->
  <g>
    <rect x="150" y="230" width="300" height="130" rx="36" fill="url(#teal)"/>
    <rect x="410" y="447" width="380" height="130" rx="36" fill="url(#violet)"/>
    <rect x="188" y="664" width="240" height="130" rx="36" fill="url(#amber)"/>
    <rect x="560" y="230" width="230" height="130" rx="36" fill="url(#sky)"/>
  </g>

  <!-- Playhead -->
  <g>
    <rect x="806" y="150" width="22" height="724" rx="11" fill="url(#red)"/>
    <path d="M 762 120 L 872 120 L 817 200 Z" fill="url(#red)"/>
  </g>
</svg>
